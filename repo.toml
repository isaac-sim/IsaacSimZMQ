########################################################################################################################
# Repo tool base settings
########################################################################################################################

[repo]
# Use the Kit Template repo configuration as a base. Only override things specific to the repo.
import_configs = ["${root}/_repo/deps/repo_kit_tools/kit-template/repo.toml"]

# Repository Name
name = "IsaacSimZMQ"

[repo_build]
msbuild.vs_version = "vs2019"
post_build.commands = []

[repo_build.premake]
linux_x86_64_cxx_abi=true

[repo_build.docker]
enabled = false


[repo_precache_exts]
ext_folders = [
  "${root}/exts",
]


[repo_symstore]
enabled = false

[repo_build.fetch.pip]
ignore_pip_cache_failure = true
licensing_enabled = false
publish_pip_cache = false

[repo_build.licensing]
enabled = false

[[repo_kit_pull_extensions.environment]]
name = "integ"
app_version_regex = ""
"tokens.registry_url" = "https://ovextensionsprod.blob.core.windows.net"
"tokens.registry_shared_name" = "shared"
"tokens.registry_name" = "kit/prod"